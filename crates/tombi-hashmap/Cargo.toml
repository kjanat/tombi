[package]
name = "tombi-hashmap"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
indexmap = { version = "2.9.0" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ahash = { version = "0.8.11" }

[target.'cfg(target_family = "wasm")'.dependencies]
ahash = { version = "0.8.11", default-features = false, features = ["std", "no-rng"] }
# Feature-only dependency used to select getrandom's JavaScript backend.
getrandom = { version = "0.3.3", optional = true }

[features]
default = []
serde = ["ahash/serde", "indexmap/serde"]
# Restore the pre-existing browser behavior explicitly. `runtime-rng` wins
# over aHash's `no-rng` marker when both are enabled.
wasm-js-rng = [
  "ahash/runtime-rng",
  "dep:getrandom",
  "getrandom/wasm_js",
]

[lints]
workspace = true
